{{ define "main" }}
<main class="posts">
    <h1>{{ .Title }}</h1>

    <ul class="posts-list">
        {{ range .Sections }}
            <li class="post-item">
                <a href="{{ .Permalink }}">
                    <span class="post-title">{{ .Title }}</span>
                </a>
            </li>
        {{ end }}
    </ul>
</main>
{{ end }}
