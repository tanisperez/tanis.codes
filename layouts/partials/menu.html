<nav class="menu">
    <ul class="menu-inner">
        {{ range .Site.Menus.main -}}
            <li><a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} class="is-active"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
    </ul>
    <p class="menu-hint">Press <span>/</span> to search</p>
</nav>
